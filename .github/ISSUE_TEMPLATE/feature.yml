name: Feature / enhancement
description: Propose a new feature or a behaviour change for Dank Calendar.
title: "area: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in all 8 sections — see `.claude/skills/write-issue/SKILL.md` for the full template
        and worked example. Title stays `area: lowercase summary` (e.g. `settings: per-calendar
        color override`).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who hits this, when, and today's workaround. One paragraph, the problem — not the solution.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal / Non-goals
      description: Shape Up appetite — the size we're willing to spend — plus an explicit no-gos list.
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      description: One INVEST line.
      placeholder: "As <user>, I want <capability>, so that <outcome>."
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Scenarios
      description: 1-5 scenarios, each strict Given/When/Then with an observable Then.
      placeholder: |
        1. Given <state>, When <action>, Then <observable result>.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: "Standing rules that bind this change (CGO, migrations, I18n, DankCommon), then one line — write \"Upstream-worthy: yes\" or \"Upstream-worthy: no\"."
      placeholder: |
        Upstream-worthy: yes
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Checkable list; every item names the scenario or constraint it proves.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Callers/data/providers/sync touched, then the layers-touched line below with [x] for every layer this change touches.
      placeholder: |
        Layers touched: [ ] QML  [ ] UI setting  [ ] IPC  [ ] DB migration  [ ] provider  [ ] background engine  [ ] HTTP/CLI
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: T-shirt size. Triage adds the matching size:S/size:M/size:L label separately — picking here doesn't apply it.
      options:
        - "S (one layer, <1h)"
        - "M (2–3 layers)"
        - "L (cross-cutting, schema, new provider)"
    validations:
      required: true
